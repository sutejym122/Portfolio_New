<svg viewBox="89 56 1422 800" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="ffbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101318"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="ffring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="url(#ffbg)"/>

  <!-- phone -->
  <rect x="618" y="94" width="364" height="724" rx="54" fill="#1c1d21" stroke="#ffffff1f" stroke-width="1"/>
  <rect x="630" y="106" width="340" height="700" rx="46" fill="#0c0d0f"/>
  <rect x="756" y="120" width="88" height="19" rx="9.5" fill="#000"/>

  <text x="658" y="190" font-size="13" fill="#6e6e73">TUESDAY, 8 SEPTEMBER</text>
  <text x="658" y="222" font-size="26" font-weight="700" fill="#f5f5f7">Today</text>

  <!-- activity ring -->
  <circle cx="800" cy="352" r="74" fill="none" stroke="#ffffff12" stroke-width="16"/>
  <circle cx="800" cy="352" r="74" fill="none" stroke="url(#ffring)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="349 466" transform="rotate(-90 800 352)"/>
  <text x="800" y="348" font-size="30" font-weight="700" fill="#f5f5f7" text-anchor="middle">75%</text>
  <text x="800" y="372" font-size="13" fill="#6e6e73" text-anchor="middle">of daily goal</text>

  <rect x="656" y="462" width="288" height="76" rx="14" fill="#ffffff0a"/>
  <text x="676" y="494" font-size="13" fill="#6e6e73">CALORIES</text>
  <text x="676" y="522" font-size="22" font-weight="600" fill="#f5f5f7">2,140 kcal</text>

  <rect x="656" y="550" width="136" height="76" rx="14" fill="#ffffff0a"/>
  <text x="676" y="582" font-size="13" fill="#6e6e73">PROTEIN</text>
  <text x="676" y="610" font-size="20" font-weight="600" fill="#f5f5f7">132 g</text>

  <rect x="808" y="550" width="136" height="76" rx="14" fill="#ffffff0a"/>
  <text x="828" y="582" font-size="13" fill="#6e6e73">STREAK</text>
  <text x="828" y="610" font-size="20" font-weight="600" fill="#30d158">12 d</text>

  <rect x="656" y="638" width="288" height="80" rx="14" fill="#2997ff1f" stroke="#2997ff40" stroke-width="1"/>
  <circle cx="688" cy="678" r="14" fill="#2997ff"/>
  <text x="688" y="684" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">AI</text>
  <text x="716" y="672" font-size="14.5" font-weight="600" fill="#f5f5f7">Meal plan ready</text>
  <text x="716" y="695" font-size="12.5" fill="#a1a1a6">Built from today&#39;s macro targets</text>

  <!-- widget, floating beside the phone -->
  <rect x="1040" y="300" width="250" height="250" rx="30" fill="#1c1d21" stroke="#ffffff1a" stroke-width="1"/>
  <text x="1072" y="344" font-size="13" fill="#6e6e73">FITFORGE</text>
  <circle cx="1165" cy="424" r="46" fill="none" stroke="#ffffff12" stroke-width="11"/>
  <circle cx="1165" cy="424" r="46" fill="none" stroke="url(#ffring)" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="217 289" transform="rotate(-90 1165 424)"/>
  <text x="1165" y="431" font-size="20" font-weight="700" fill="#f5f5f7" text-anchor="middle">75%</text>
  <text x="1072" y="510" font-size="13" fill="#a1a1a6">12-day streak</text>
</svg>
