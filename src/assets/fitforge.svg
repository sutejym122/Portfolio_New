<svg viewBox="89 56 1422 800" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f7ff"/>
      <stop offset="100%" stop-color="#eaf0f8"/>
    </linearGradient>
    <filter id="fsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#30d158"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fbg)"/>

  <!-- phone -->
  <g filter="url(#fsh)">
    <rect x="620" y="96" width="360" height="720" rx="52" fill="#ffffff"/>
  </g>
  <rect x="620" y="96" width="360" height="720" rx="52" fill="none" stroke="#00000010" stroke-width="1"/>
  <rect x="756" y="118" width="88" height="20" rx="10" fill="#f0f0f3"/>

  <text x="656" y="196" font-size="15" fill="#86868b">Today</text>
  <text x="656" y="228" font-size="27" font-weight="700" fill="#1d1d1f">FitForge</text>

  <!-- activity ring -->
  <circle cx="800" cy="352" r="76" fill="none" stroke="#eceff3" stroke-width="17"/>
  <circle cx="800" cy="352" r="76" fill="none" stroke="url(#ring)" stroke-width="17"
          stroke-linecap="round" stroke-dasharray="358 478" transform="rotate(-90 800 352)"/>
  <text x="800" y="346" font-size="30" font-weight="700" fill="#1d1d1f" text-anchor="middle">75%</text>
  <text x="800" y="372" font-size="14" fill="#86868b" text-anchor="middle">of goal</text>

  <rect x="656" y="466" width="288" height="78" rx="15" fill="#f7f7f9"/>
  <text x="676" y="500" font-size="14" fill="#86868b">Calories</text>
  <text x="676" y="528" font-size="23" font-weight="600" fill="#1d1d1f">2,140 kcal</text>

  <rect x="656" y="558" width="136" height="78" rx="15" fill="#f7f7f9"/>
  <text x="676" y="592" font-size="14" fill="#86868b">Protein</text>
  <text x="676" y="620" font-size="21" font-weight="600" fill="#1d1d1f">132 g</text>

  <rect x="808" y="558" width="136" height="78" rx="15" fill="#f7f7f9"/>
  <text x="828" y="592" font-size="14" fill="#86868b">Streak</text>
  <text x="828" y="620" font-size="21" font-weight="600" fill="#1d1d1f">12 d</text>

  <rect x="656" y="650" width="288" height="76" rx="15" fill="#eef5ff"/>
  <circle cx="686" cy="688" r="13" fill="#0071e3"/>
  <text x="686" y="694" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">AI</text>
  <text x="712" y="682" font-size="15" font-weight="600" fill="#1d1d1f">Meal plan ready</text>
  <text x="712" y="704" font-size="13" fill="#6e6e73">Generated from today's targets</text>
</svg>
